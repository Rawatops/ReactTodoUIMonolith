name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main


jobs:

  # ==========================================================
  # Build and Deploy Job
  # ==========================================================
  build_and_deploy_job:

    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:

      # ------------------------------------------------------
      # 1. Checkout Source Code
      # ------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false


      # ------------------------------------------------------
      # 2. Install Dependencies Required for OIDC Token
      # ------------------------------------------------------
      - name: Install OIDC Client
        run: |
          npm install @actions/core@1.6.0 @actions/http-client


      # ------------------------------------------------------
      # 3. Get GitHub OIDC ID Token
      # ------------------------------------------------------
      - name: Get ID Token
        uses: actions/github-script@v7
        id: idtoken

        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();

          result-encoding: string


      # ------------------------------------------------------
      # 4. Build and Deploy to Azure Static Web Apps
      # ------------------------------------------------------
      - name: Build And Deploy
        id: builddeploy

        uses: Azure/static-web-apps-deploy@v1

        env:
          # Prevent React warnings from being treated as errors
          CI: false

        with:

          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_PLANT_0DDCEB400 }}

          action: upload

          # React Application Root Directory
          app_location: "/"

          # No Azure Functions API
          api_location: ""

          # React Production Build Output
          output_location: "build"

          # GitHub OIDC Token
          github_id_token: ${{ steps.idtoken.outputs.result }}


  # ==========================================================
  # Close Pull Request Environment
  # ==========================================================
  close_pull_request_job:

    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    name: Close Pull Request Job

    steps:

      - name: Close Pull Request
        id: closepullrequest

        uses: Azure/static-web-apps-deploy@v1

        with:

          action: close

          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRAVE_PLANT_0DDCEB400 }}
